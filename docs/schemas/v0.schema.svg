<svg xmlns="http://www.w3.org/2000/svg" width="680" height="540" viewBox="0 0 680 540" role="img" font-family="Helvetica, Arial, sans-serif">
  <title>Strati del database, versione 0</title>
  <desc>Database usa catalogo, codifica record e heap; il catalogo usa l'heap; l'heap usa slotted page e pager; il pager legge e scrive il file su disco.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="680" height="540" fill="#FFFFFF"/>

  <!-- Database -->
  <rect x="140" y="30" width="400" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
  <text x="340" y="52" text-anchor="middle" font-size="14" font-weight="bold" fill="#3C3489">Database (API)</text>
  <text x="340" y="72" text-anchor="middle" font-size="12" fill="#534AB7">create_table, insert, select</text>

  <!-- Catalogo -->
  <rect x="140" y="116" width="190" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
  <text x="235" y="138" text-anchor="middle" font-size="14" font-weight="bold" fill="#3C3489">Catalogo</text>
  <text x="235" y="158" text-anchor="middle" font-size="12" fill="#534AB7">Tabelle e schemi</text>

  <!-- Codifica record -->
  <rect x="350" y="116" width="190" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
  <text x="445" y="138" text-anchor="middle" font-size="14" font-weight="bold" fill="#3C3489">Codifica record</text>
  <text x="445" y="158" text-anchor="middle" font-size="12" fill="#534AB7">Riga ↔ byte</text>

  <!-- Heap -->
  <rect x="140" y="202" width="400" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
  <text x="340" y="224" text-anchor="middle" font-size="14" font-weight="bold" fill="#085041">Heap</text>
  <text x="340" y="244" text-anchor="middle" font-size="12" fill="#0F6E56">Tabella = lista di pagine</text>

  <!-- Slotted page -->
  <rect x="140" y="288" width="400" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
  <text x="340" y="310" text-anchor="middle" font-size="14" font-weight="bold" fill="#085041">Slotted page</text>
  <text x="340" y="330" text-anchor="middle" font-size="12" fill="#0F6E56">Record dentro 8 KB</text>

  <!-- Pager -->
  <rect x="140" y="374" width="400" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
  <text x="340" y="396" text-anchor="middle" font-size="14" font-weight="bold" fill="#085041">Pager</text>
  <text x="340" y="416" text-anchor="middle" font-size="12" fill="#0F6E56">File = array di pagine</text>

  <!-- File su disco -->
  <rect x="140" y="460" width="400" height="44" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8" stroke-dasharray="5 4"/>
  <text x="340" y="487" text-anchor="middle" font-size="14" font-weight="bold" fill="#444441">File su disco</text>

  <!-- Frecce -->
  <g stroke="#5F5E5A" stroke-width="1.2" fill="none">
    <line x1="235" y1="86" x2="235" y2="113" marker-end="url(#arrow)"/>
    <line x1="445" y1="86" x2="445" y2="113" marker-end="url(#arrow)"/>
    <line x1="340" y1="86" x2="340" y2="199" marker-end="url(#arrow)"/>
    <line x1="235" y1="172" x2="235" y2="199" marker-end="url(#arrow)"/>
    <line x1="340" y1="258" x2="340" y2="285" marker-end="url(#arrow)"/>
    <path d="M540 230 L590 230 L590 402 L543 402" marker-end="url(#arrow)"/>
    <line x1="340" y1="430" x2="340" y2="457" marker-end="url(#arrow)"/>
  </g>
</svg>
